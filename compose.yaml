name: atlas-local
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: atlas
      POSTGRES_DB: atlas
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Run python -m atlas.worker init-local first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
volumes:
  atlas-postgres:
